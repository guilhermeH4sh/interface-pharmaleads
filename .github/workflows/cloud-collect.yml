name: Coleta PharmaLeads
run-name: ${{ inputs.modo == 'nacional' && format('Nacional {0}/{1} · {2}', inputs.rodada, inputs.total_rodadas, inputs.resumo) || format('Coleta PharmaLeads {0}', inputs.request_id) }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identificador da solicitação
        required: true
        type: string
      locais:
        description: Locais, um por linha
        required: true
        type: string
      segmentos:
        description: Segmentos separados por vírgula
        required: true
        type: string
      profundidade:
        description: Profundidade no Maps
        required: true
        type: string
      emails:
        description: Buscar e-mails nos sites
        required: true
        type: string
      enriquecer_sites:
        description: Enriquecer contatos públicos com Playwright
        required: true
        type: string
      modo:
        description: avulsa ou nacional
        required: false
        default: avulsa
        type: string
      rodada:
        description: Rodada atual da cobertura nacional
        required: false
        default: '0'
        type: string
      total_rodadas:
        description: Total de rodadas da cobertura nacional
        required: false
        default: '0'
        type: string
      resumo:
        description: Locais visíveis no título da rodada
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: pharmaleads-cloud-collect
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LOCAIS: ${{ inputs.locais }}
      SEGMENTOS: ${{ inputs.segmentos }}
      PROFUNDIDADE: ${{ inputs.profundidade }}
      EMAILS: ${{ inputs.emails }}
      ENRIQUECER_SITES: ${{ inputs.enriquecer_sites }}
      SUPABASE_URL: https://qxsdcrywsjkrpcbfgbxb.supabase.co
      SUPABASE_AUTH_MODE: user
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_9AdBAjeEHFysAVpC7VCLMw_cDgQ4Fl0
      SUPABASE_USER_ID: 677ed1e4-3e73-4f2c-951f-e77386f305da
      SUPABASE_EMAIL: ${{ secrets.SUPABASE_EMAIL }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar navegador para enriquecimento
        if: inputs.enriquecer_sites == 'true'
        run: |
          python -m pip install --disable-pip-version-check "playwright>=1.40,<2"
          python -m playwright install --with-deps chromium
      - name: Coletar e sincronizar
        env:
          PHARMALEADS_HOME: ${{ runner.temp }}/pharmaleads
        run: python -m pharmaleads.cloud_job
      - name: Agendar próxima rodada nacional
        if: success() && inputs.modo == 'nacional'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RODADA: ${{ inputs.rodada }}
          SEGMENTOS: ${{ inputs.segmentos }}
          PROFUNDIDADE: ${{ inputs.profundidade }}
          EMAILS: ${{ inputs.emails }}
          ENRIQUECER_SITES: ${{ inputs.enriquecer_sites }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python -m pharmaleads.cobertura
